services:
  db:
    container_name: flownote_db
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: flownote
    volumes:
      - db_data:/data/db
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: flownote_backend
    build:
      context: ./backend/flownote-backend/
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://db:27017/flownote
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
    expose:
      - "3000"

  frontend:
    container_name: flownote_frontend
    build:
      context: ./frontend/
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - backend
    expose:
      - "5173"

volumes:
  db_data: